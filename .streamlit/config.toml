# Sistema dado por la skill design-taste-frontend (palette white-navy-tab, type host).
# primaryColor marino (no naranja): Streamlit lo usa también como color de TEXTO en pestañas
# y enlaces, y el naranja como texto no se lee (2,3:1). El naranja va solo en el CSS de la app.
[theme]
base = "light"
primaryColor = "#1f2b4d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f2"
textColor = "#1f2b4d"
font = "sans-serif"
baseRadius = "medium"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
