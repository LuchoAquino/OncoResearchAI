# Sistema visual: marino + azul (enlaces y pestaña activa) + un color por tipo de fármaco y de
# documento (el CSS de la app). El naranja solo va en bordes y marcas: como texto no se lee.
# La app usa siempre el tema claro (ver DARK en app/streamlit_app.py).
[theme]
base = "light"
primaryColor = "#2457d6"
backgroundColor = "#f5f7fc"
secondaryBackgroundColor = "#e8effe"
textColor = "#1b2a4e"
font = "sans-serif"
baseRadius = "medium"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
