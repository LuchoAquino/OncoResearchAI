[project]
name = "onco-research-ai"
version = "0.1.0"
description = "RAG + agents + MCP research assistant for melanoma drug literature, trials and labels"
readme = "README.md"
authors = [
    { name = "Lucho Aquino", email = "luis.gonzales.a@uni.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "litellm>=1.109.1",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymupdf4llm>=2.1",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "sqlglot>=30.31.0",
    "streamlit>=1.67.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
onco-research-ai = "onco_research_ai:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
