[project]
name = "onco-research-ai"
version = "0.1.0"
description = "RAG + agents + MCP platform for competitive intelligence in melanoma"
readme = "README.md"
authors = [
    { name = "Lucho Aquino", email = "luis.gonzales.a@uni.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.109.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.8",
    "tenacity>=9.2.1",
]

[project.scripts]
onco-research-ai = "onco_research_ai:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
